name: Atualizar painel

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar os dados publicados (recordes e histórico)
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          for f in leonida.json historico.json; do
            curl -fsSL "$base/$f?t=$(date +%s)" -o "/tmp/$f" || echo "sem $f publicado, usando o do repositório"
          done
          # Usa o publicado (mais novo), mas sem perder o cache do histórico que está no repositório.
          python -I - <<'EOF'
          import json, pathlib
          for nome in ("leonida.json", "historico.json"):
              pub, rep = pathlib.Path("/tmp") / nome, pathlib.Path("dados") / nome
              if not pub.exists():
                  continue
              try:
                  novo = json.loads(pub.read_text("utf-8"))
              except ValueError:
                  continue
              if nome == "leonida.json" and rep.exists():
                  velho = json.loads(rep.read_text("utf-8"))
                  cache = dict(velho.get("_cache") or {})
                  cache.update(novo.get("_cache") or {})
                  novo["_cache"] = cache
              rep.write_text(json.dumps(novo, ensure_ascii=False), "utf-8")
          EOF

      - name: Coletar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I coletar.py

      - name: Montar o site
        run: python -I montar_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
