name: Atualizar painel

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-traducao.txt

      - name: Baixar os dados publicados (recordes e histórico)
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          for f in leonida.json historico.json estado.json; do
            curl -fsSL "$base/$f?t=$(date +%s)" -o "/tmp/$f" || echo "sem $f publicado, usando o do repositório"
          done
          # Usa o publicado (mais novo), mas sem perder o cache e as traduções que estão no repositório.
          python -I - <<'EOF'
          import json, pathlib
          def ler(p):
              try:
                  return json.loads(p.read_text("utf-8")) if p.exists() else None
              except ValueError:
                  return None
          dados, tmp = pathlib.Path("dados"), pathlib.Path("/tmp")
          estado = ler(dados / "estado.json") or {}
          pub_est, pub_dados = ler(tmp / "estado.json") or {}, ler(tmp / "leonida.json")
          for chave in ("_cache", "_trad"):
              junto = dict(estado.get(chave) or {})
              if chave == "_cache" and pub_dados and pub_dados.get("_cache"):
                  junto.update(pub_dados["_cache"])  # formato antigo: cache dentro do leonida.json
              junto.update(pub_est.get(chave) or {})
              estado[chave] = junto
          (dados / "estado.json").write_text(json.dumps(estado, ensure_ascii=False), "utf-8")
          if pub_dados:
              pub_dados.pop("_cache", None)
              (dados / "leonida.json").write_text(json.dumps(pub_dados, ensure_ascii=False), "utf-8")
          hist = ler(tmp / "historico.json")
          if hist:
              (dados / "historico.json").write_text(json.dumps(hist, ensure_ascii=False), "utf-8")
          EOF

      - name: Coletar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I coletar.py

      - name: Guardar os modelos de tradução entre execuções
        uses: actions/cache@v4
        with:
          path: ~/.cache/leonida-modelos
          key: argos-en_pt-1_9-en_es-1_0

      - name: Traduzir textos novos para português e espanhol (Argos, grátis e offline)
        continue-on-error: true
        run: |
          python -m pip install -q -r requirements-traducao.txt
          m=~/.cache/leonida-modelos
          if [ ! -f "$m/ok" ]; then
            mkdir -p "$m" && cd "$m"
            curl -fsSL -o en_pt.zip https://argos-net.com/v1/translate-en_pt-1_9.argosmodel
            curl -fsSL -o en_es.zip https://argos-net.com/v1/translate-en_es-1_0.argosmodel
            python -I -c "import zipfile;[zipfile.ZipFile(f).extractall('.') for f in ('en_pt.zip','en_es.zip')]"
            rm -f en_pt.zip en_es.zip && touch ok && cd -
          fi
          LEONIDA_MODELOS="$m" python -I traduzir.py

      - name: Montar o site
        run: python -I montar_site.py

      - name: Manter o banco do chat acordado (o Supabase grátis pausa após 7 dias sem uso)
        continue-on-error: true
        run: |
          chave=$(python -I -c "import re;print(re.search(r\"SUPA_KEY = '([^']+)'\", open('site_base/ao-vivo.js',encoding='utf-8').read()).group(1))")
          url=$(python -I -c "import re;print(re.search(r\"SUPA_URL = '([^']+)'\", open('site_base/ao-vivo.js',encoding='utf-8').read()).group(1))")
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" "$url/rest/v1/leonida_chat?select=id&limit=1" -H "apikey: $chave" -H "Authorization: Bearer $chave")
          echo "supabase respondeu $codigo"

      - name: Sinal de vida (o GitHub desliga o agendamento após 60 dias sem commits)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt 2592000 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/sinal-de-vida.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/sinal-de-vida.txt
            git commit -m "Sinal de vida do agendamento"
            git push
          else
            echo "último commit tem menos de 30 dias"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
