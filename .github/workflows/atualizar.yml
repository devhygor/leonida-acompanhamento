name: Atualizar o Radar VI

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar os dados publicados (estado da corrida e histórico)
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          for f in estado_corrida.json corrida.json; do
            if curl -fsSL "$base/$f?t=$(date +%s)" -o "/tmp/$f" && python -I -c "import json,sys;json.load(open(sys.argv[1]))" "/tmp/$f"; then
              cp "/tmp/$f" "dados/$f"
            else
              echo "sem $f publicado, usando o do repositório"
            fi
          done

      - name: Coletar a corrida (GitHub + IA)
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -I corrida.py

      - name: Montar o site
        run: python -I montar_site.py

      - name: Manter o banco do chat acordado (o Supabase grátis pausa após 7 dias sem uso)
        continue-on-error: true
        run: |
          chave=$(python -I -c "import re;print(re.search(r\"SUPA_KEY = '([^']+)'\", open('site_base/ao-vivo.js',encoding='utf-8').read()).group(1))")
          url=$(python -I -c "import re;print(re.search(r\"SUPA_URL = '([^']+)'\", open('site_base/ao-vivo.js',encoding='utf-8').read()).group(1))")
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" "$url/rest/v1/leonida_chat?select=id&limit=1" -H "apikey: $chave" -H "Authorization: Bearer $chave")
          echo "supabase respondeu $codigo"

      - name: Sinal de vida (o GitHub desliga o agendamento após 60 dias sem commits)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt 2592000 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/sinal-de-vida.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/sinal-de-vida.txt
            git commit -m "Sinal de vida do agendamento"
            git push
          else
            echo "último commit tem menos de 30 dias"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
