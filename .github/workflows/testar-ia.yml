name: Testar IA gratuita (temporário)

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o GitHub Models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for modelo in openai/gpt-4.1-mini openai/gpt-4o-mini openai/gpt-4.1-nano; do
            echo "== $modelo"
            curl -s -m 60 -w "\nHTTP %{http_code}\n" https://models.github.ai/inference/chat/completions \
              -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"model\":\"$modelo\",\"messages\":[{\"role\":\"user\",\"content\":\"Responda apenas com a palavra: funcionando\"}],\"max_tokens\":10}" | tail -c 400
            echo
          done
          echo "== limites"
          curl -s -m 30 -D - -o /dev/null https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"oi"}],"max_tokens":2}' | grep -i "ratelimit" || true
